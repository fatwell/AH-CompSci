    <title>Advanced higher 404 - WDD</title>
    <script>
      function mouseOver() {
        document.getElementById("demo").style.color = "green";
      }
      function mouseOut() {
        document.getElementById("demo").style.color = "black";
      }
	  
    </script>
  </head>

  <body>
    <centre> 
    <h1 id="demo" onclick="mouseOver()" onmouseout="mouseOut()">Welcome</h1>
    <div class="example1">Example 1 should be display block</div>
    <div class="example2">Example 2 should not appear at all</div>
    <div class="example3">Example 3 should not appear aswell</div>
    <footer>Footer Section</footer>
    </centre>
  </body>
